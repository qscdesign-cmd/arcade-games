<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arcade Hub 3D — 50 Games</title><style>*{box-sizing:border-box}body{margin:0;background:#090e20;color:#fff;font:16px system-ui,Arial}header{padding:24px 5%;background:linear-gradient(110deg,#171b43,#0a1429);border-bottom:1px solid #28375a}h1{margin:0;font-size:32px}header p{color:#a8b7d3;margin:7px 0}main{max-width:1200px;margin:auto;padding:25px 20px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}input,select,button{font:inherit;border:1px solid #34456e;border-radius:10px;padding:11px;background:#131e38;color:white}input{flex:1;min-width:190px}button{cursor:pointer;background:#375bff;border:0;font-weight:700}button:hover{filter:brightness(1.2)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:15px}.tile{background:#131c35;border:1px solid #273657;border-radius:16px;overflow:hidden;cursor:pointer;transition:transform .15s}.tile:hover{transform:translateY(-4px);border-color:#7397ff}.art{height:118px;display:grid;place-items:center;font-size:54px;background:linear-gradient(140deg,var(--c),#11182f)}.info{padding:12px}.info b{display:block}.info small{color:#9baed1}.overlay{position:fixed;inset:0;background:#030816ed;display:none;align-items:center;justify-content:center;padding:12px;z-index:5}.overlay.active{display:flex}.panel{width:min(100%,980px);background:#101a32;border:1px solid #3b5285;border-radius:15px;overflow:hidden}.top{padding:12px;display:flex;align-items:center;justify-content:space-between;gap:10px}.top h2{font-size:18px;margin:0}#game{display:block;width:100%;height:auto;aspect-ratio:16/9;background:#0b1730;touch-action:none}.bottom{padding:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;color:#c3d1e8;font-size:14px}.touch{display:flex;gap:8px}.touch button{min-width:62px}#close{background:#a43b54}#status{font-weight:700;color:#b9eaff}</style><header><h1>🎮 ARCADE HUB <span style="color:#75baff">3D</span></h1><p>50 playable arcade challenges • Snow racing • Cube jumping • Driving • Space • Dodging</p></header><main><div class="toolbar"><input id="search" placeholder="Search 50 games..."><select id="filter"><option value="all">All games</option><option value="Snow Rider">Snow Rider</option><option value="Cube Dash">Cube Dash</option><option value="Highway Racer">Highway Racer</option><option value="Space Flight">Space Flight</option><option value="Neon Dodge">Neon Dodge</option></select></div><div class="grid" id="grid"></div></main><div class="overlay" id="overlay"><div class="panel"><div class="top"><h2 id="title">Game</h2><div><span id="status"></span> <button id="restart">Restart</button> <button id="close">✕ Close</button></div></div><canvas id="game" width="960" height="540"></canvas><div class="bottom"><span>← → / A D move • SPACE / ↑ jump or boost • P pause • R restart</span><div class="touch"><button id="left">◀</button><button id="jump">JUMP</button><button id="right">▶</button></div></div></div></div><script>
const families=[{name:'Snow Rider',icon:'🏂',color:'#277bc1',names:['Alpine Rush','Frozen Summit','Avalanche Escape','Ice Canyon','Winter Storm','Glacier Run','Snowboard X','Frost Valley','Sled Sprint','Polar Drop']},{name:'Cube Dash',icon:'🟪',color:'#6336be',names:['Neon Jump','Spike City','Rhythm Rush','Cube Escape','Laser Leap','Gravity Beats','Electric Blocks','Pulse Runner','Hyper Hop','Pixel Panic']},{name:'Highway Racer',icon:'🏎️',color:'#bb432b',names:['Turbo Highway','Midnight Drive','Traffic Escape','Desert Racer','City Sprint','Nitro Lane','Speed Trap','Coastal Drive','Road Fury','Velocity X']},{name:'Space Flight',icon:'🚀',color:'#254d9d',names:['Asteroid Field','Galaxy Run','Cosmic Drift','Meteor Rush','Star Chaser','Nebula Dash','Orbit Escape','Rocket Blitz','Deep Space','Warp Drive']},{name:'Neon Dodge',icon:'⚡',color:'#8b2ab1',names:['Laser Tunnel','Cyber Sprint','Grid Escape','Vortex Dash','Plasma Run','Light Runner','Dark Circuit','Neon Storm','Pulse Dodge','Infinity Run']}];
const games=families.flatMap((f,k)=>f.names.map((name,i)=>({name,family:f.name,icon:f.icon,color:f.color,type:k,level:i})));const grid=document.getElementById('grid'),search=document.getElementById('search'),filter=document.getElementById('filter');function render(){let q=search.value.toLowerCase();grid.innerHTML='';games.filter(g=>(filter.value==='all'||g.family===filter.value)&&g.name.toLowerCase().includes(q)).forEach(g=>{let el=document.createElement('div');el.className='tile';el.innerHTML=`<div class="art" style="--c:${g.color}">${g.icon}</div><div class="info"><b>${g.name}</b><small>${g.family} • Game ${games.indexOf(g)+1}</small></div>`;el.onclick=()=>openGame(g);grid.appendChild(el)})}search.oninput=filter.onchange=render;render();
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),overlay=document.getElementById('overlay'),status=document.getElementById('status');let current=null,player,objects=[],particles=[],score=0,dead=false,paused=false,frame=0,last=0,spawn=0,raf=0;const keys={};function reset(){player={x:0,y:0,vy:0,ground:0};objects=[];particles=[];score=0;dead=false;paused=false;frame=0;spawn=0;status.textContent='Score 0'}function openGame(g){current=g;document.getElementById('title').textContent=g.icon+' '+g.name;overlay.classList.add('active');reset();cancelAnimationFrame(raf);last=performance.now();raf=requestAnimationFrame(loop)}function closeGame(){overlay.classList.remove('active');current=null;cancelAnimationFrame(raf)}document.getElementById('close').onclick=closeGame;document.getElementById('restart').onclick=reset;document.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','Space'].includes(e.code))e.preventDefault();keys[e.code]=true;if(e.code==='KeyP')paused=!paused;if(e.code==='KeyR'&&current)reset()});document.addEventListener('keyup',e=>keys[e.code]=false);for(let [id,code] of [['left','ArrowLeft'],['right','ArrowRight'],['jump','Space']]){let el=document.getElementById(id);el.onpointerdown=e=>{e.preventDefault();keys[code]=true};el.onpointerup=el.onpointercancel=el.onpointerleave=()=>keys[code]=false}
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h)}function line(x,y,xx,yy,c,w=2){ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(xx,yy);ctx.stroke()}function poly(points,c){ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(...points[0]);points.slice(1).forEach(p=>ctx.lineTo(...p));ctx.closePath();ctx.fill()}function text(s,x,y,size=25,c='white'){ctx.fillStyle=c;ctx.font=`bold ${size}px system-ui`;ctx.textAlign='center';ctx.fillText(s,x,y)}function rnd(a,b){return a+Math.random()*(b-a)}function road(t){let horizon=170;for(let i=0;i<22;i++){let z=i/22,y=horizon+(z*z)*(540-horizon),z2=(i+1)/22,y2=horizon+z2*z2*(540-horizon),half=60+z*400,half2=60+z2*400;poly([[480-half,y],[480+half,y],[480+half2,y2],[480-half2,y2]],i%2?'#25344b':'#2c3e59');if(i%3===0){let d=3+z*10;line(480,y,480,y2,'#d8e8f0',d)}}}
function sky(){let k=current.type;let grad=ctx.createLinearGradient(0,0,0,540);grad.addColorStop(0,['#2b77b8','#130e41','#192445','#090c31','#0a1030'][k]);grad.addColorStop(1,['#c9f1ff','#321464','#8c4961','#1b3e79','#44236b'][k]);ctx.fillStyle=grad;ctx.fillRect(0,0,960,540);if(k===0){for(let i=0;i<9;i++){let x=i*150-80;poly([[x,250],[x+95,65+(i%3)*25],[x+200,250]],i%2?'#b9d9ec':'#e2f4ff')}rect(0,250,960,290,'#eaf8ff')}if(k===3){for(let i=0;i<85;i++){let x=(i*139+frame*(1+i%3))%960,y=(i*83+frame*(2+i%4))%540;rect(x,y,2,2,'#e8f6ff')}}}
function spawnObj(){let type=current.type;let lane=Math.floor(Math.random()*3)-1;objects.push({lane,z:0,x:960,y:0,kind:Math.random()<.18?'coin':'hazard',passed:false});if(type===1){objects[objects.length-1].x=1010;objects[objects.length-1].lane=0}}
function loop(t){if(!current)return;let dt=Math.min((t-last)/16.67,2);last=t;if(!paused&&!dead){frame+=dt;let speed=(3.8+current.level*.25+Math.min(score/150,3))*dt;let dir=(keys.ArrowLeft||keys.KeyA?-1:0)+(keys.ArrowRight||keys.KeyD?1:0);player.x=Math.max(-1.2,Math.min(1.2,player.x+dir*.075*dt));if((keys.Space||keys.ArrowUp||keys.KeyW)&&player.y===0)player.vy=15;player.y=Math.max(0,player.y+player.vy*dt);player.vy-=.8*dt;if(player.y===0)player.vy=0;spawn-=dt;if(spawn<=0){spawnObj();spawn=Math.max(14,43-current.level*1.6-Math.min(score/50,12))}score+=dt*.14;for(let o of objects){if(current.type===1){o.x-=speed*7;o.z=(1010-o.x)/850}else{o.z+=speed/210}if(!o.passed&&o.z>.88){o.passed=true;if(Math.abs(player.x-o.lane)<.43&&player.y<35){if(o.kind==='coin')score+=15;else dead=true}}}objects=objects.filter(o=>o.z<1.2&&o.x>-80)}draw();status.textContent='Score '+Math.floor(score);if(dead)status.textContent='GAME OVER • Score '+Math.floor(score);raf=requestAnimationFrame(loop)}
function draw(){sky();let type=current.type;if(type!==1){road();for(let o of objects){let z=o.z;if(z<0||z>1.15)continue;let y=170+z*z*370,x=480+o.lane*(55+z*240),size=8+z*64;if(o.kind==='coin'){ctx.fillStyle='#ffd84a';ctx.beginPath();ctx.arc(x,y-size*.5,size*.34,0,Math.PI*2);ctx.fill()}else if(type===0){poly([[x-size*.6,y],[x,y-size*1.5],[x+size*.6,y]],'#226e9b');poly([[x-size*.4,y-size*.7],[x,y-size*1.5],[x+size*.4,y-size*.7]],'#d7f5ff')}else if(type===2){rect(x-size*.7,y-size*1.4,size*1.4,size*1.4,'#f04454');rect(x-size*.5,y-size*1.15,size,.25*size,'#ffd8a8')}else if(type===3){poly([[x,y-size],[x+size,y],[x,y+size],[x-size,y]],'#a6b5b9')}else{rect(x-size/2,y-size,size,size,'#fc428a')}}let px=480+player.x*300,py=462-player.y*2.5;if(type===0){poly([[px-32,py+35],[px+32,py+35],[px+18,py-20],[px-18,py-20]],'#ff7b29');rect(px-12,py-34,24,24,'#192e62');line(px-38,py+45,px+38,py+45,'#285a94',7)}else if(type===2){rect(px-35,py-40,70,95,'#23c1e9');rect(px-23,py-25,46,22,'#112f50');rect(px-25,py+38,14,15,'#fbe47a');rect(px+12,py+38,14,15,'#fbe47a')}else if(type===3){poly([[px,py-60],[px+40,py+35],[px,py+15],[px-40,py+35]],'#9be9ff');poly([[px-18,py+25],[px,py+60],[px+18,py+25]],'#ffb03d')}else{poly([[px,py-48],[px+35,py],[px,py+48],[px-35,py]],'#65f7d4')}}else{rect(0,410,960,130,'#21164b');line(0,410,960,410,'#e943ff',5);for(let i=0;i<14;i++){let x=((i*100-frame*6)%1050+1050)%1050;line(x,410,x-70,540,'#4c347e',2)}for(let o of objects){if(o.x<0||o.x>960)continue;if(o.kind==='coin'){ctx.beginPath();ctx.arc(o.x,350,18,0,Math.PI*2);ctx.fillStyle='#ffd447';ctx.fill()}else poly([[o.x-24,410],[o.x,353],[o.x+24,410]],'#ff3e9e')}let px=200,py=370-player.y*2.2;ctx.save();ctx.translate(px,py);ctx.rotate(frame*.03*(player.y>0?1:0));rect(-26,-26,52,52,'#71d7ff');rect(-14,-14,28,28,'#2936a2');ctx.restore()}text(current.name,480,43,28,'#ffffff');text('SCORE '+Math.floor(score),480,80,18,'#c4e8ff');if(dead||paused){rect(0,0,960,540,'#050817ad');text(dead?'GAME OVER':'PAUSED',480,250,55);text(dead?'Press R or Restart to try again':'Press P to continue',480,302,24)}}
</script></html>
