(()=>{'use strict';const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),W=800,H=600;const home=document.getElementById('home'),play=document.getElementById('play'),scoreEl=document.getElementById('score'),titleEl=document.getElementById('gameTitle'),helpEl=document.getElementById('help');const keys=new Set();let game='',state={},last=0,acc=0,raf=0,over=false,message='',challenge=null;const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));const rect=(x,y,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(x,y,w,h)};const circle=(x,y,r,c)=>{ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()};function label(t,x,y,size=28,color='white'){ctx.fillStyle=color;ctx.font=`bold ${size}px system-ui`;ctx.textAlign='center';ctx.fillText(t,x,y)}function score(t){scoreEl.textContent=t}function finish(t){over=true;message=t}function init(){over=false;message='';acc=0;keys.clear();if(game==='snake'){state={body:[{x:10,y:10},{x:9,y:10},{x:8,y:10}],dir:{x:1,y:0},next:{x:1,y:0},food:null,points:0};food()}else if(game==='pong'){state={ball:{x:400,y:300,vx:300*(Math.random()<.5?-1:1),vy:rnd(-170,170)},player:255,ai:255,us:0,them:0}}else if(game==='breakout'){state={paddle:350,ball:{x:400,y:470,vx:200,vy:-250},bricks:[],points:0,lives:3};for(let r=0;r<(challenge?challenge.rows:5);r++)for(let c=0;c<10;c++)state.bricks.push({x:38+c*73,y:70+r*35,alive:true,color:['#ff6b6b','#ffb454','#ffdf6b','#71e5b0','#77c5ff'][r]})}else if(game==='dodge'){state={x:400,blocks:[],elapsed:0,spawn:0,points:0}}else if(game==='catch'){state={x:400,items:[],spawn:0,points:0,lives:3,elapsed:0}}else if(game==='flappy'){state={y:300,vy:0,pipes:[],spawn:0,points:0,elapsed:0}}else if(game==='target'){state={x:rnd(70,730),y:rnd(90,500),radius:42,points:0,time:challenge?challenge.goal:30}}else if(game==='runner'){state={y:0,vy:0,obstacles:[],spawn:0,points:0,elapsed:0}}updateScore()}function food(){let free=[];for(let y=0;y<20;y++)for(let x=0;x<27;x++)if(!state.body.some(p=>p.x===x&&p.y===y))free.push({x,y});if(!free.length){finish('You win!');return}state.food=free[Math.floor(Math.random()*free.length)]}function updateScore(){if(game==='snake')score('Score: '+state.points);if(game==='pong')score(`You ${state.us} : ${state.them} CPU`);if(game==='breakout')score(`Score: ${state.points} • Lives: ${state.lives}`);if(game==='dodge')score('Score: '+state.points);if(game==='catch')score(`Score: ${state.points} • Lives: ${state.lives}`);if(game==='flappy'||game==='runner')score('Score: '+state.points);if(game==='target')score(`Hits: ${state.points} • Time: ${Math.ceil(state.time)}s`)}function moveSnake(){const s=state;s.dir=s.next;const head={x:s.body[0].x+s.dir.x,y:s.body[0].y+s.dir.y};const eating=head.x===s.food.x&&head.y===s.food.y;const collisionBody=eating?s.body:s.body.slice(0,-1);if(head.x<0||head.x>=27||head.y<0||head.y>=20||collisionBody.some(p=>p.x===head.x&&p.y===head.y)){finish('Game over!');return}s.body.unshift(head);if(eating){s.points+=challenge?challenge.points:10;food()}else s.body.pop();updateScore()}function update(dt){if(over)return;const s=state;if(game==='snake'){acc+=dt;const step=Math.max(.045,(challenge?challenge.snakeStep:.13)-s.points/3000);while(acc>=step&&!over){moveSnake();acc-=step}}else if(game==='pong'){let speed=450;if(keys.has('ArrowUp')||keys.has('KeyW'))s.player-=speed*dt;if(keys.has('ArrowDown')||keys.has('KeyS'))s.player+=speed*dt;s.player=clamp(s.player,0,490);s.ai=clamp(s.ai+clamp(s.ball.y-55-s.ai,-310*dt,310*dt),0,490);const b=s.ball;b.x+=b.vx*dt;b.y+=b.vy*dt;if(b.y<12||b.y>588){b.vy*=-1;b.y=clamp(b.y,12,588)}if(b.vx<0&&b.x<48&&b.x>24&&b.y>s.player&&b.y<s.player+110){b.vx=Math.abs(b.vx)*1.05;b.vy+=(b.y-s.player-55)*2;b.x=48}if(b.vx>0&&b.x>752&&b.x<776&&b.y>s.ai&&b.y<s.ai+110){b.vx=-Math.abs(b.vx)*1.05;b.vy+=(b.y-s.ai-55)*2;b.x=752}if(b.x<0||b.x>800){if(b.x<0)s.them++;else s.us++;if(s.us>=(challenge?challenge.goal:7)||s.them>=(challenge?challenge.goal:7))finish(s.us>=7?'You win!':'Computer wins!');else s.ball={x:400,y:300,vx:(b.x<0?300:-300),vy:rnd(-160,160)};updateScore()}}else if(game==='breakout'){if(keys.has('ArrowLeft')||keys.has('KeyA'))s.paddle-=490*dt;if(keys.has('ArrowRight')||keys.has('KeyD'))s.paddle+=490*dt;s.paddle=clamp(s.paddle,0,680);const b=s.ball;b.x+=b.vx*dt;b.y+=b.vy*dt;if(b.x<10||b.x>790){b.vx*=-1;b.x=clamp(b.x,10,790)}if(b.y<10){b.vy=Math.abs(b.vy)}if(b.vy>0&&b.y>=550&&b.y<=570&&b.x>=s.paddle-10&&b.x<=s.paddle+130){b.vy=-Math.abs(b.vy);b.vx=(b.x-(s.paddle+60))*5;b.y=548}for(const brick of s.bricks){if(brick.alive&&b.x>brick.x-9&&b.x<brick.x+68&&b.y>brick.y-9&&b.y<brick.y+28){brick.alive=false;b.vy*=-1;s.points+=challenge?challenge.points:10;break}}if(!s.bricks.some(b=>b.alive))finish('You cleared all bricks!');if(b.y>615){s.lives--;if(s.lives<=0)finish('Game over!');else s.ball={x:400,y:470,vx:200,vy:-250}}updateScore()}else if(game==='dodge'){if(keys.has('ArrowLeft')||keys.has('KeyA'))s.x-=420*dt;if(keys.has('ArrowRight')||keys.has('KeyD'))s.x+=420*dt;s.x=clamp(s.x,25,775);s.elapsed+=dt;s.spawn+=dt;const interval=Math.max(.24,.75-s.elapsed*.009);while(s.spawn>interval){s.spawn-=interval;s.blocks.push({x:rnd(20,730),y:-60,w:rnd(35,75),h:rnd(25,60),v:rnd(170,260)+s.elapsed*5})}for(const b of s.blocks){b.y+=b.v*dt;if(b.x<s.x+22&&b.x+b.w>s.x-22&&b.y<550&&b.y+b.h>510)finish('Game over!')}s.blocks=s.blocks.filter(b=>b.y<650);s.points=Math.floor(s.elapsed*10);updateScore()}else if(game==='catch'){s.elapsed+=dt;s.spawn+=dt;if(keys.has('ArrowLeft')||keys.has('KeyA'))s.x-=500*dt;if(keys.has('ArrowRight')||keys.has('KeyD'))s.x+=500*dt;s.x=clamp(s.x,45,755);if(s.spawn>.48){s.spawn=0;s.items.push({x:rnd(30,770),y:-25,bomb:Math.random()<.23,v:180+s.elapsed*4})}for(const item of s.items){item.y+=item.v*dt;if(!item.done&&item.y>525&&item.y<570&&Math.abs(item.x-s.x)<58){item.done=true;if(item.bomb)s.lives--;else s.points+=challenge?challenge.points:10}if(!item.done&&item.y>610){item.done=true;if(!item.bomb)s.lives--}}s.items=s.items.filter(i=>!i.done);if(s.lives<=0)finish('Game over!');updateScore()}else if(game==='flappy'){s.elapsed+=dt;s.vy+=950*dt;s.y+=s.vy*dt;s.spawn+=dt;if(s.spawn>1.7){s.spawn=0;s.pipes.push({x:820,gap:rnd(170,430),passed:false})}for(const pipe of s.pipes){pipe.x-=220*dt;if(!pipe.passed&&pipe.x+75<190){pipe.passed=true;s.points++}if(pipe.x<215&&pipe.x+75>165&&(s.y<pipe.gap-95||s.y>pipe.gap+95))finish('Game over!')}s.pipes=s.pipes.filter(p=>p.x>-90);if(s.y<18||s.y>582)finish('Game over!');updateScore()}else if(game==='target'){s.time-=dt;if(s.time<=0){s.time=0;finish('Time up!')}updateScore()}else if(game==='runner'){s.elapsed+=dt;s.spawn+=dt;if((keys.has('Space')||keys.has('ArrowUp')||keys.has('KeyW'))&&s.y===0)s.vy=650;s.y+=s.vy*dt;s.vy-=1550*dt;if(s.y<0){s.y=0;s.vy=0}if(s.spawn>Math.max(.8,1.65-s.elapsed*.012)){s.spawn=0;s.obstacles.push({x:840,w:rnd(28,52),h:rnd(35,75)})}for(const b of s.obstacles){b.x-=(310+s.elapsed*3)*dt;if(b.x<155&&b.x+b.w>105&&s.y<b.h-8)finish('Game over!')}s.obstacles=s.obstacles.filter(b=>b.x>-80);s.points=Math.floor(s.elapsed*5);updateScore()}}function draw(){rect(0,0,W,H,challenge?challenge.bg:'#0c142a');if(game==='snake'){const cell=28;for(let y=0;y<20;y++)for(let x=0;x<27;x++)rect(22+x*cell,20+y*cell,cell-2,cell-2,(x+y)%2?'#172943':'#192d49');const f=state.food;circle(22+f.x*cell+13,20+f.y*cell+13,11,'#ff6481');state.body.forEach((p,i)=>rect(23+p.x*cell,21+p.y*cell,cell-4,cell-4,i===0?'#b4ff5b':'#49d998'))}else if(game==='pong'){for(let y=0;y<600;y+=36)rect(398,y,4,20,'#344365');rect(25,state.player,18,110,'#b4ff5b');rect(757,state.ai,18,110,'#ff72d2');circle(state.ball.x,state.ball.y,12,'white')}else if(game==='breakout'){for(const b of state.bricks)if(b.alive)rect(b.x,b.y,67,27,b.color);rect(state.paddle,560,120,17,'#a6ff52');circle(state.ball.x,state.ball.y,10,'#fff')}else if(game==='dodge'){for(let y=0;y<600;y+=60)rect(0,y,800,1,'#1c3050');for(const b of state.blocks)rect(b.x,b.y,b.w,b.h,'#ff6588');ctx.fillStyle='#70d5ff';ctx.beginPath();ctx.moveTo(state.x,505);ctx.lineTo(state.x-25,560);ctx.lineTo(state.x+25,560);ctx.closePath();ctx.fill()}else if(game==='catch'){rect(0,575,800,25,'#254c4c');rect(state.x-58,542,116,25,'#a6ff52');for(const item of state.items){circle(item.x,item.y,17,item.bomb?'#222':'#ff5574');label(item.bomb?'💣':'🍎',item.x,item.y+9,26)}}else if(game==='flappy'){for(const p of state.pipes){rect(p.x,0,75,p.gap-95,'#51d88c');rect(p.x,p.gap+95,75,600-p.gap-95,'#51d88c')}circle(190,state.y,19,'#ffda56');circle(197,state.y-5,4,'#18243a')}else if(game==='target'){circle(state.x,state.y,state.radius,'#ff5f77');circle(state.x,state.y,28,'white');circle(state.x,state.y,14,'#ff5f77');label('Click or tap the target!',400,52,24)}else if(game==='runner'){rect(0,520,800,80,'#35536b');rect(110,520-state.y-60,45,60,'#a6ff52');for(const b of state.obstacles)rect(b.x,520-b.h,b.w,b.h,'#ff729e')}if(over){rect(0,0,W,H,'#050a18c9');label(message,400,270,48);label('Press Restart to play again',400,326,23,'#d7e1ff')}}function frame(t){if(!game)return;const dt=Math.min((t-last)/1000||0,.035);last=t;update(dt*(challenge?challenge.speed:1));draw();raf=requestAnimationFrame(frame)}function openGame(name){cancelAnimationFrame(raf);challenge=CHALLENGES.find(c=>c.id===name);if(!challenge)return;game=challenge.engine;home.classList.add('hidden');play.classList.add('active');titleEl.textContent=challenge.title+' · '+{snake:'🐍 Snake',pong:'🏓 Pong',breakout:'🧱 Brick Breaker',dodge:'🚀 Dodge Rush',catch:'🍎 Fruit Catcher',flappy:'🐦 Flappy Flyer',target:'🎯 Target Tap',runner:'🏃 Jump Runner'}[game];helpEl.textContent={snake:'Arrow keys or WASD to steer. Eat red food. Avoid walls and your tail.',pong:'Up/Down or W/S to move. First to 7 wins.',breakout:'Left/Right or A/D to move your paddle.',dodge:'Left/Right or A/D to dodge falling blocks.',catch:'Left/Right or A/D to catch fruit. Avoid bombs!',flappy:'Press Space, Up, or tap the canvas to flap.',target:'Click or tap the red target. You have 30 seconds!',runner:'Space or Up to jump over const ENGINES=[['snake','🐍','Snake'],['pong','🏓','Pong'],['breakout','🧱','Brick Breaker'],['dodge','🚀','Dodge Rush'],['catch','🍎','Fruit Catcher'],['flappy','🐦','Flappy Flyer'],['target','🎯','Target Tap'],['runner','🏃','Jump Runner']];
const THEMES=['Classic','Turbo','Neon','Midnight','Sunset','Ice','Jungle','Galaxy','Candy','Lava','Retro','Pixel','Ocean','Desert','Electric','Shadow','Rainbow','Zen','Hyper','Gold','Frost','Comet','Vortex','Legend','Ultimate'];
const COLORS=['#0c142a','#172a30','#1d1237','#0c1021','#39202b','#122e3f','#153125','#171936','#36213d','#371a21','#20253a','#152a43','#102b3b','#342818','#1b2344','#171724','#2d2038','#182d30','#202039','#332815','#183447','#22253b','#2c1e3a','#112738','#20172f'];
const CHALLENGES=ENGINES.flatMap(([engine,emoji,base])=>THEMES.map((theme,i)=>({id:engine+'-'+i,engine,emoji,title:theme+' '+base,theme,bg:COLORS[i],speed:+(0.75+i*.035).toFixed(3),goal:engine==='pong'?5+(i%7):engine==='target'?20+(i%8)*5:7,rows:3+(i%5),snakeStep:.18-(i%9)*.01,points:5+(i%5)*5,variant:i+1}))).filter((c,i)=>Math.floor(i/25)*6+(i%25)<50 && (i%25)<(Math.floor(i/25)<2?7:6));
let page=0;const PAGE_SIZE=24;let favorites=new Set();try{favorites=new Set(JSON.parse(localStorage.getItem('arcadeFavorites')||'[]'))}catch(e){}
const catalog=document.getElementById('catalog'),search=document.getElementById('search'),category=document.getElementById('category');
for(const [engine,emoji,base] of ENGINES){const o=document.createElement('option');o.value=engine;o.textContent=emoji+' '+base;category.append(o)}
function renderCatalog(){const q=search.value.trim().toLowerCase(),cat=category.value;const filtered=CHALLENGES.filter(c=>(cat==='all'||cat===c.engine||(cat==='favorites'&&favorites.has(c.id)))&&c.title.toLowerCase().includes(q));const total=Math.max(1,Math.ceil(filtered.length/PAGE_SIZE));page=Math.min(page,total-1);catalog.replaceChildren();for(const c of filtered.slice(page*PAGE_SIZE,(page+1)*PAGE_SIZE)){const card=document.createElement('div');card.className='card';card.style.cursor='pointer';const art=document.createElement('div');art.className='art';art.style.background=c.bg;art.textContent=c.emoji;const details=document.createElement('div');details.className='details';const h=document.createElement('h2');h.textContent=c.title;const fav=document.createElement('button');fav.className='favorite';fav.textContent=favorites.has(c.id)?'★':'☆';fav.setAttribute('aria-label','Toggle favorite');fav.onclick=e=>{e.stopPropagation();favorites.has(c.id)?favorites.delete(c.id):favorites.add(c.id);try{localStorage.setItem('arcadeFavorites',JSON.stringify([...favorites]))}catch(e){}renderCatalog()};h.append(fav);const p=document.createElement('p');p.textContent='Challenge '+c.variant+' · Speed '+c.speed+'×';const tag=document.createElement('span');tag.className='tag';tag.textContent='▶ PLAY NOW';details.append(h,p,tag);card.append(art,details);card.onclick=()=>openGame(c.id);catalog.append(card)}document.getElementById('count').textContent=filtered.length+' games';document.getElementById('pageNum').textContent='Page '+(page+1)+' of '+total;document.getElementById('prev').disabled=page===0;document.getElementById('next').disabled=page>=total-1}
search.addEventListener('input',()=>{page=0;renderCatalog()});category.addEventListener('change',()=>{page=0;renderCatalog()});document.getElementById('prev').onclick=()=>{page--;renderCatalog()};document.getElementById('next').onclick=()=>{page++;renderCatalog()};renderCatalog();
document.getElementById('restart').onclick=init;document.getElementById('back').onclick=()=>{cancelAnimationFrame(raf);game='';play.classList.remove('active');home.classList.remove('hidden')};document.getElementById('fullscreen').onclick=()=>{const el=document.getElementById('stage');if(document.fullscreenElement)document.exitFullscreen();else el.requestFullscreen?.()};document.addEventListener('keydown',e=>{if(!game)return;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();keys.add(e.code);if(game==='snake'){const d={ArrowUp:[0,-1],KeyW:[0,-1],ArrowDown:[0,1],KeyS:[0,1],ArrowLeft:[-1,0],KeyA:[-1,0],ArrowRight:[1,0],KeyD:[1,0]}[e.code];if(d&&!(d[0]===-state.dir.x&&d[1]===-state.dir.y))state.next={x:d[0],y:d[1]}}});document.addEventListener('keyup',e=>keys.delete(e.code));document.querySelectorAll('[data-key]').forEach(b=>{const key=b.dataset.key;const down=e=>{e.preventDefault();keys.add(key);if(game==='snake'){const d={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[key];if(d&&!(d[0]===-state.dir.x&&d[1]===-state.dir.y))state.next={x:d[0],y:d[1]}}};const up=e=>{e.preventDefault();keys.delete(key)};b.addEventListener('pointerdown',down);b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('pointerleave',up)});canvas.addEventListener('pointerdown',e=>{if(!game||over)return;const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*800/r.width,y=(e.clientY-r.top)*600/r.height;if(game==='flappy')state.vy=-340;if(game==='runner'&&state.y===0)state.vy=650;if(game==='target'&&Math.hypot(x-state.x,y-state.y)<state.radius){state.points++;state.x=rnd(70,730);state.y=rnd(90,500);updateScore()}});document.addEventListener('keydown',e=>{if(game==='flappy'&&!over&&(e.code==='Space'||e.code==='ArrowUp'))state.vy=-340});canvas.addEventListener('pointermove',e=>{if(game!=='breakout'&&game!=='dodge'&&game!=='catch')return;const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*800/r.width;if(game==='breakout')state.paddle=clamp(x-60,0,680);else if(game==='catch')state.x=clamp(x,45,755);else state.x=clamp(x,25,775)});
})();</script></body></html>
